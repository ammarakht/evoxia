<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evoxia — Cinematic Introduction</title>
  <meta name="description" content="Experience the official cinematic prelude to Evoxia Studio — Digital Engineering, Fluid Mobile Systems, and World-Class Brand Design.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'%3E%3Cg transform='rotate(-30 12 12)'%3E%3Ccircle cx='7.3' cy='3.2' r='1.45'/%3E%3Crect x='5.5' y='4.7' width='3.6' height='14.6' rx='1.8'/%3E%3Crect x='14.9' y='4.7' width='3.6' height='14.6' rx='1.8'/%3E%3Ccircle cx='16.7' cy='20.8' r='1.45'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000000;
      color: #ffffff;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient noise */
    .grain {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 50;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Fullscreen Cinematic Container */
    .intro-viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      background: #000000;
    }

    /* Video Canvas Layer */
    .video-stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .main-video-backdrop {
      display: none;
      position: absolute;
      inset: -5%;
      width: 110%;
      height: 110%;
      object-fit: cover;
      object-position: center;
      filter: blur(48px) brightness(0.55) saturate(1.25);
      opacity: 0.65;
      pointer-events: none;
      z-index: 1;
    }

    .main-video-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .main-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      filter: contrast(1.06) brightness(0.98);
      transform: scale(1.01);
      transition: filter 0.5s ease;
    }

    /* Subtle Cinematic Vignette */
    .vignette-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 35%, rgba(0, 0, 0, 0.4) 70%, rgba(0, 0, 0, 0.9) 100%),
                  linear-gradient(180deg, rgba(0, 0, 0, 0.8) 0%, transparent 16%, transparent 75%, rgba(0, 0, 0, 0.95) 100%);
    }

    /* Ambient Dynamic Glow */
    .ambient-glow {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.15) 0%, rgba(129, 140, 248, 0.08) 35%, transparent 70%);
      mix-blend-mode: screen;
      animation: ambientBreathing 4.5s ease-in-out infinite alternate;
    }

    @keyframes ambientBreathing {
      0% { opacity: 0.35; transform: scale(0.95); }
      100% { opacity: 0.85; transform: scale(1.05); }
    }

    /* Top Bar */
    .top-bar {
      position: relative;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 40px;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.7) 0%, transparent 100%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .brand-wrap {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: #ffffff;
      text-decoration: none;
    }

    .brand-logo {
      width: 26px;
      height: 26px;
      fill: #ffffff;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.6));
    }

    .brand-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: #94a3b8;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      text-transform: uppercase;
    }

    .pulsing-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
      animation: dotPulse 1.6s ease-in-out infinite;
    }

    @keyframes dotPulse {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.25); }
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .glass-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 40px;
      padding: 0 16px;
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: #f1f5f9;
      background: rgba(18, 18, 24, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      cursor: pointer;
      text-decoration: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    .glass-btn:hover {
      background: rgba(30, 30, 42, 0.9);
      border-color: rgba(255, 255, 255, 0.35);
      color: #ffffff;
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 16px rgba(255, 255, 255, 0.08);
    }

    .btn-portal {
      background: linear-gradient(135deg, #1e1e28 0%, #2e2e40 100%);
      border-color: rgba(255, 255, 255, 0.32);
      font-weight: 600;
      color: #ffffff;
    }

    .btn-portal:hover {
      border-color: rgba(255, 255, 255, 0.6);
      background: linear-gradient(135deg, #2e2e40 0%, #44445c 100%);
    }

    .key-hint {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 6px;
      font-size: 10px;
      font-weight: 600;
      color: #94a3b8;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 4px;
      margin-left: 2px;
    }

    /* Sound Waves */
    .sound-bars {
      display: inline-flex;
      align-items: center;
      gap: 2.5px;
      height: 12px;
    }

    .sound-bars span {
      width: 2px;
      background: #38bdf8;
      border-radius: 1px;
      transition: height 0.2s ease;
    }

    .btn-sound.is-active .sound-bars span:nth-child(1) { height: 6px; animation: sWave 0.8s ease infinite alternate; }
    .btn-sound.is-active .sound-bars span:nth-child(2) { height: 12px; animation: sWave 0.6s ease infinite 0.15s alternate; }
    .btn-sound.is-active .sound-bars span:nth-child(3) { height: 8px; animation: sWave 0.7s ease infinite 0.3s alternate; }

    @keyframes sWave {
      0% { height: 3px; }
      100% { height: 12px; }
    }

    .btn-sound:not(.is-active) .sound-bars span {
      height: 3px;
      opacity: 0.4;
      background: #64748b;
    }

    /* Center Play/Pause Overlay Indicator */
    .center-overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .center-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 24px 36px;
      border-radius: 20px;
      background: rgba(10, 10, 15, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      opacity: 0;
      transform: scale(0.92);
      transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
    }

    .center-badge.show {
      opacity: 1;
      transform: scale(1);
    }

    .center-badge h2 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #ffffff;
    }

    .center-badge p {
      font-size: 13px;
      color: #94a3b8;
    }

    /* Bottom Control Bar */
    .bottom-bar {
      position: relative;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 24px 40px 36px;
      background: linear-gradient(0deg, rgba(0, 0, 0, 0.9) 0%, transparent 100%);
    }

    .timeline-container {
      position: relative;
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      cursor: pointer;
      transition: height 0.2s ease;
    }

    .timeline-container:hover {
      height: 8px;
    }

    .timeline-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
      box-shadow: 0 0 14px rgba(129, 140, 248, 0.9);
      position: relative;
      transition: width 0.06s linear;
    }

    .timeline-scrubber {
      position: absolute;
      right: -6px;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.9);
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .timeline-container:hover .timeline-scrubber {
      opacity: 1;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .left-controls {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.3);
      transform: scale(1.05);
    }

    .time-display {
      font-family: monospace, "SF Mono", "Consolas", monospace;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.05em;
      color: #cbd5e1;
    }

    .phase-label {
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: 0.05em;
      color: #38bdf8;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .right-controls {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .btn-launch {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      height: 42px;
      padding: 0 20px;
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #000000;
      background: #ffffff;
      border: 1px solid #ffffff;
      border-radius: 9px;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-launch:hover {
      background: #f1f5f9;
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.7);
    }

    @media (max-width: 900px), (max-aspect-ratio: 16/10) {
      .main-video-backdrop {
        display: block !important;
      }
      .video-stage {
        padding: 72px 16px 110px;
        padding-top: max(72px, calc(env(safe-area-inset-top) + 64px));
        padding-bottom: max(110px, calc(env(safe-area-inset-bottom) + 90px));
      }
      .main-video-wrapper {
        width: 100%;
        max-width: min(100%, calc((100dvh - 190px) * (16 / 9)));
        height: auto;
        aspect-ratio: 16 / 9;
      }
      .main-video {
        position: relative;
        width: 100%;
        height: auto;
        aspect-ratio: 16 / 9;
        object-fit: contain;
        border-radius: 14px;
        box-shadow: 0 16px 50px rgba(0, 0, 0, 0.9), 0 0 35px rgba(56, 189, 248, 0.25);
        border: 1px solid rgba(255, 255, 255, 0.14);
      }
    }

    @media (max-width: 768px) {
      .top-bar {
        padding: 16px 20px;
      }
      .brand-title {
        font-size: 15px;
      }
      .brand-logo {
        width: 22px;
        height: 22px;
      }
      .brand-badge, .key-hint, .phase-label {
        display: none;
      }
      .glass-btn {
        height: 36px;
        padding: 0 12px;
        font-size: 11.5px;
      }
      .bottom-bar {
        padding: 18px 20px max(24px, calc(env(safe-area-inset-bottom) + 16px));
        gap: 12px;
      }
      .time-display {
        font-size: 11px;
      }
      .btn-launch {
        height: 38px;
        padding: 0 14px;
        font-size: 12.5px;
      }
    }

    @media (max-width: 540px) {
      .top-bar {
        padding: 14px 16px;
      }
      .top-actions {
        gap: 8px;
      }
      .glass-btn {
        padding: 0 10px;
        font-size: 11px;
        gap: 5px;
      }
      .controls-row {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }
      .left-controls {
        justify-content: space-between;
        width: 100%;
      }
      .right-controls {
        width: 100%;
        display: flex;
        justify-content: space-between;
      }
      .btn-launch {
        width: 100%;
        height: 44px;
        justify-content: center;
        font-size: 13.5px;
      }
      .icon-btn {
        width: 38px;
        height: 38px;
      }
    }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <div class="intro-viewport" id="intro-viewport">
    <!-- Pure Cinematic Video Stage -->
    <div class="video-stage">
      <div class="main-video-wrapper">
        <video
          id="cinematic-video"
          class="main-video"
          src="Wand_casts_magic_ray_202609051137.mp4"
          autoplay
          muted
          playsinline
          webkit-playsinline
          disablepictureinpicture
          disableremoteplayback
          preload="auto"
        ></video>
      </div>
      <div class="vignette-overlay" aria-hidden="true"></div>
      <div class="ambient-glow" aria-hidden="true"></div>
    </div>

    <!-- Aesthetic Floating Silent / Audio Toggle Button -->
    <button type="button" id="sound-btn" class="intro-silent-btn" aria-label="Toggle Sound" title="Sound Muted / Click to Unmute">
      <!-- Muted State Icon (Default) -->
      <svg class="silent-icon silent-icon--muted" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <line x1="23" y1="9" x2="17" y2="15"/>
        <line x1="17" y1="9" x2="23" y2="15"/>
      </svg>
      <!-- Active Sound State Icon -->
      <svg class="silent-icon silent-icon--active" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
      </svg>
    </button>
  </div>

  <style>
    .intro-silent-btn {
      position: absolute;
      top: calc(24px + env(safe-area-inset-top, 0px));
      right: calc(24px + env(safe-area-inset-right, 0px));
      z-index: 50;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(14, 14, 18, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e4e4e7;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.45), 0 0 12px rgba(255, 255, 255, 0.06);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                  background 0.25s ease,
                  border-color 0.25s ease,
                  box-shadow 0.25s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .intro-silent-btn:hover {
      transform: scale(1.08);
      color: #ffffff;
      background: rgba(26, 26, 34, 0.88);
      border-color: rgba(255, 255, 255, 0.45);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.65), 0 0 20px rgba(56, 189, 248, 0.35);
    }

    .intro-silent-btn:active {
      transform: scale(0.92);
    }

    .intro-silent-btn .silent-icon--active {
      display: none;
      color: #38bdf8;
    }

    .intro-silent-btn.is-active .silent-icon--muted {
      display: none;
    }

    .intro-silent-btn.is-active .silent-icon--active {
      display: block;
    }
  </style>

  <script>
    (function () {
      'use strict';

      const video = document.getElementById('cinematic-video');
      const soundBtn = document.getElementById('sound-btn');

      function toggleSound() {
        video.muted = !video.muted;
        if (!video.muted) {
          video.volume = 0.95;
          soundBtn.classList.add('is-active');
          soundBtn.setAttribute('title', 'Sound Active / Click to Mute');
        } else {
          soundBtn.classList.remove('is-active');
          soundBtn.setAttribute('title', 'Sound Muted / Click to Unmute');
        }
      }

      if (soundBtn) {
        soundBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleSound();
        });
      }

      // Tap screen to toggle audio or enter site
      document.getElementById('intro-viewport').addEventListener('click', (e) => {
        if (e.target.closest('#sound-btn')) return;
        if (video.muted) {
          toggleSound();
        } else {
          window.location.href = 'index.html';
        }
      });

      // When video ends, smoothly enter main site
      video.addEventListener('ended', () => {
        window.location.href = 'index.html';
      });

      // Keyboard shortcuts
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' || e.key === 'Enter') {
          window.location.href = 'index.html';
        } else if (e.code === 'Space' || e.key === 'm' || e.key === 'M') {
          e.preventDefault();
          toggleSound();
        }
      });

      // Autoplay
      video.play().catch(() => {
        const onInteract = () => {
          video.play();
          window.removeEventListener('click', onInteract);
          window.removeEventListener('touchstart', onInteract);
        };
        window.addEventListener('click', onInteract, { once: true });
        window.addEventListener('touchstart', onInteract, { once: true });
      });
    })();
  </script>
</body>
</html>
